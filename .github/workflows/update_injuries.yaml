on:
  # Started daily by guga31bb's cron via workflow_dispatch. GitHub's
  # schedule fired ~10 hours late and duplicated those runs.
  # schedule:
  #   # every day at 7:07 AM UTC from Sep to Feb
  #   - cron: '7 7 * 1,2,9,10,11,12 *'
  workflow_dispatch:

name: update-injuries

# Setup installs this repo's DESCRIPTION dependencies, incl. the private
# nflapi, ngsscrapR and nflverse-espn, with a read-only app token. The upload
# token (nflverse-data only) is minted after setup and only set on the release
# step. See https://github.com/nflverse/actions
permissions:
  contents: read

jobs:
  update-injuries:
    name: update-injuries
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      - uses: actions/checkout@v6

      - id: read-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi, ngsscrapR, nflverse-espn

      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflapi nflverse/ngsscrapR nflverse/nflverse-espn nflverse/nflverse-players nflverse/nflverse-data nflverse/nflreadr
          github-pat: ${{ steps.read-token.outputs.token }}

      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data
          contents: write

      - name: Update injuries
        run: Rscript exec/update-injuries.R
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
